spring.application.name=club-management-system

# Server
server.port=8080

# H2 Database (file-based for persistent storage)
spring.datasource.url=jdbc:h2:file:./data/clubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=clubManagementSystemSecretKey2024VeryLongAndSecureSecretKeyForJWT
jwt.expiration=86400000

# Logging
logging.level.com.clubmanagement=DEBUG
